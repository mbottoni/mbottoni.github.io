name: CI
on:
  push:
    branches:
    - main

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: denoland/setup-deno@v1
      with:
        # Pinned to the version used locally so CI and `deno task build`
        # parse the sources identically (see .dvmrc).
        deno-version: v1.38.2

    - run: deno task build
    - name: Check internal links and assets
      run: deno task check

    - name: Deploy
      uses: peaceiris/actions-gh-pages@364c31d33bb99327c77b3a5438a83a357a6729ad # v3.4.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: out/res
        force_orphan: true
